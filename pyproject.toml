[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-hydrate"
version = "0.1.0a1"
description = "Local-first context hydration for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "crdunwel"}]
keywords = ["ai-agents", "context", "developer-tools", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/crdunwel/ctx"
Repository = "https://github.com/crdunwel/ctx.git"
Issues = "https://github.com/crdunwel/ctx/issues"
Security = "https://github.com/crdunwel/ctx/security/policy"

[project.scripts]
ctx = "ctx.cli:main"
context-hydrate = "ctx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
