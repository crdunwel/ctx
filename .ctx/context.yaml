version: 1

project:
  id: ctx
  name: ctx
  aliases:
    - context hydrate

node:
  id: root
  name: ctx local context system
  summary: >
    Headless, local-first tooling that lets AI agents discover durable project
    meaning from version-controlled semantic context nodes.

artifacts:
  - path: AGENTS.md
    role: Product architecture, behavioral contracts, safeguards, and verification.
  - path: README.md
    role: Public quickstart, workflows, hook guidance, trust boundary, and data disclosure.
  - path: LICENSE
    role: Apache-2.0 terms governing public use, modification, and distribution.
  - path: SECURITY.md
    role: Supported-version policy, private vulnerability reporting route, and agent/source-data boundary.
  - path: CONTRIBUTING.md
    role: Focused development, verification, context-maintenance, and pull-request expectations.
  - path: pyproject.toml
    role: Python packaging metadata and the ctx/context-hydrate entry points.
  - path: .github/workflows/ci.yml
    role: macOS/Linux Python tests, ctx gates, package build, and entry-point CI.
  - path: src/ctx/cli.py
    role: Two-word command grammar, global/per-command help, dispatch, and deterministic output rendering.
  - path: src/ctx/demo.py
    role: Deterministic model-free sample, manifests, hooks, and initial freshness.
  - path: src/ctx/schema.py
    role: Typed manifest parsing and structural schema diagnostics.
  - path: src/ctx/models.py
    role: Immutable manifest records and canonical modeled serialization.
  - path: src/ctx/validation.py
    role: Project-wide deterministic validation and filesystem safety checks.
  - path: src/ctx/retrofit.py
    role: Bounded hierarchical repository inventory, balanced evidence sampling, and standalone agent retrofit guidance.
  - path: src/ctx/retrofit_agent.py
    role: Guarded Codex snapshots, evidence-bound proposals, publication, and rollback.
  - path: src/ctx/universe.py
    role: Policy-gated project resolution and lexical ranking with match evidence.
  - path: src/ctx/hydration.py
    role: Intent-bound context traversal with gates, budgets, deduplication, and warnings.
  - path: src/ctx/freshness.py
    role: Node ownership, source hashing, canonical locks, and freshness status.
  - path: src/ctx/reconciliation.py
    role: Affected-scope review with bounded Git change evidence, guarded updates or acknowledgements, validation, sealing, and rollback.
  - path: src/ctx/runs.py
    role: Immutable task baselines, acknowledgements, continuation, and completion state.
  - path: src/ctx/codex_hooks.py
    role: Codex UserPromptSubmit hydration and single-continuation Stop reconciliation adapters.
  - path: src/ctx/integration.py
    role: Create-only Codex hook installation and read-only duplicate-scope diagnostics.
  - path: src/ctx/git_integration.py
    role: Create-only Git pre-commit freshness reminders with explicit warning and conservative blocking policies.
  - path: src/ctx/agent_instructions.py
    role: Guarded Git-scoped AGENTS.md review, exact saved plans, and race-safe explicit application.
  - path: src/ctx/lifecycle.py
    role: Retrofit publication, freshness, hooks, registration, and rollback transaction.
  - path: docs/CLI.md
    role: Canonical two-word user command contract, compatibility policy, outputs, and exit semantics.
  - path: tests/test_retrofit.py
    role: Read-only, bounded, ignored-path, adversarial, and agent-prompt retrofit coverage.
  - path: tests/test_retrofit_run.py
    role: Black-box coverage for guarded agent invocation, exact dry-run plan reuse, transaction rollback, registration, and initial locks.
  - path: tests/test_retrofit_review_cli.py
    role: Black-box coverage for mandatory dry-run review of fresh graphs and missing-manifest-only proposals.
  - path: tests/test_retrofit_inspection.py
    role: Bounded corpus, fair media sampling, duplicate suppression, catalog, and full-fingerprint retrofit snapshot coverage.
  - path: tests/test_product_cli.py
    role: Product-level coverage for help, direct commands, registry, resolution, hydration, and status.
  - path: tests/test_demo.py
    role: Black-box proof that the bundled sample is create-only, strictly valid, fresh, progressively hydratable, and hook-reconciled.
  - path: tests/test_item_artifact_evidence.py
    role: End-to-end evidence mapping coverage for exact hydration, compact ancestry, human display, freshness, and reconciliation inspection.
  - path: tests/test_reconcile.py
    role: End-to-end coverage for acknowledgement, manifest update, strict validation, lock refresh, and rollback.
  - path: tests/test_reconcile_diff.py
    role: Bounded affected-file Git diff, deletion redaction, untracked routing, fallback, and adapter-data safety coverage.
  - path: tests/test_git_integration.py
    role: Git hook no-clobber, linked-worktree, warning, blocking, and staged-consistency coverage.
  - path: tests/test_agent_instructions.py
    role: AGENTS.md prompt, selector, proposal, plan-tamper, atomic-apply, and rollback safety coverage.
  - path: tests/test_runs.py
    role: Immutable-baseline, concurrent-hook, acknowledgement-fingerprint, race, secret-persistence, and run-storage safety regressions.
  - path: tests/test_hooks.py
    role: End-to-end Codex prompt/Stop lifecycle coverage including hydration, one continuation, selective completion, and invalid-context repair.
  - path: tests/test_freshness_subset.py
    role: Regression coverage proving run completion refreshes reviewed lock entries without blessing unrelated stale nodes.

items:
  - id: context-is-untrusted-data
    kind: invariant
    title: Context records are untrusted data
    summary: >
      Manifest text describes project meaning but is never executed and cannot
      override user instructions, policy, AGENTS.md, or source code.

  - id: agent-source-data-boundary
    kind: invariant
    title: Agent-assisted source processing is explicit
    summary: >
      Agent modes fingerprint all eligible evidence for race detection but
      expose only bounded filtered snapshots. Reconciliation adds a capped
      affected-file HEAD-to-working-tree diff, redacts deleted bodies, and keeps
      current source authoritative. Path filters are not secret detection;
      sensitive files must be excluded, model-free prompts remain available,
      and generated manifest text requires review before commit.
    artifacts:
      - README.md
      - SECURITY.md
      - src/ctx/retrofit_agent.py
      - src/ctx/reconciliation.py
      - tests/test_reconcile_diff.py

  - id: create-only-initialization
    kind: invariant
    title: Initialization is create-only
    summary: >
      Project and node initialization never rewrites an existing manifest;
      identical requests are no-ops and conflicts fail without partial writes.

  - id: semantic-node-identity
    kind: invariant
    title: Node identity is semantic
    summary: >
      Context URIs are built from stable project, ancestor-node, and item IDs
      rather than physical directory names.

  - id: explicit-auditable-context-retrieval
    kind: invariant
    title: Context traversal requires explicit auditable intent
    summary: >
      Search ranks coherent same-field matches and reports why they matched.
      External context is read only from a registered checkout after its reuse
      policy is enforced. Task hydration expands only an exact URI, a named
      external project with one strong scope match, or a unique explicit node
      or item on the active local routing frontier; weak or tied matches remain
      dormant and emit a warning instead of silently widening context.
    artifacts:
      - src/ctx/universe.py
      - src/ctx/hydration.py
      - tests/test_product_cli.py

  - id: item-artifacts-route-evidence
    kind: decision
    title: Durable items cite manifest-native source evidence
    summary: >
      Any invariant, decision, or pattern may associate itself with a selective
      subset of the node's declared artifacts so hydration can route an agent
      from a durable claim to its authoritative implementation evidence.
    artifacts:
      - src/ctx/models.py
      - src/ctx/validation.py
      - src/ctx/hydration.py
      - src/ctx/freshness.py
      - tests/test_item_artifact_evidence.py
    reason: >
      Keeping evidence links in version-controlled manifests avoids adding
      tool-specific backlinks to source while deterministic freshness and
      reconciliation keep every declaring node reviewable when evidence moves.

  - id: thin-cli-service-boundaries
    kind: decision
    title: Keep the CLI thin
    summary: >
      Argument parsing and rendering delegate discovery, schema, validation,
      registry, hydration, freshness, reconciliation, and mutation behavior to
      small application modules.
    reason: >
      Agent-neutral services keep durable behavior testable without coupling
      core project context to a specific client.

  - id: experimental-public-preview
    kind: decision
    title: Publish the 0.1 line as an experimental developer preview
    summary: >
      The preview targets Python 3.11–3.14 on macOS and Linux with explicit
      compatibility and security gates; it does not claim stable V1 before the
      real-agent, broader-Git, and scale gates pass.
    artifacts:
      - README.md
      - LICENSE
      - SECURITY.md
      - CONTRIBUTING.md
      - pyproject.toml
      - .github/workflows/ci.yml
    reason: >
      Alpha status permits review and use without overstating schema stability,
      platform coverage, or completion of V1 evidence gates.

  - id: model-free-retrofit-prompt
    kind: decision
    title: Retrofit through generated agent guidance
    summary: >
      The portable prompt subcommand inventories eligible repository metadata
      without invoking a model or mutating the target; the bare retrofit command
      may pass that same prompt to a separately installed local agent adapter.
    artifacts:
      - src/ctx/retrofit.py
      - src/ctx/retrofit_agent.py
      - tests/test_retrofit.py
      - tests/test_retrofit_run.py
    reason: >
      Keeping inventory and prompting deterministic preserves an agent-neutral
      boundary while the optional adapter provides a simple one-command path.

  - id: two-word-happy-path
    kind: decision
    title: Default commands to the current project
    summary: >
      Common workflows use ctx demo, retrofit, hydrate, status, and reconcile
      from the current project. Bare retrofit enables one canonical hook scope,
      initializes freshness, and registers the checkout; --no-hooks opts out.
      ctx retrofit review forces a dry-run scope audit of a fresh graph.
    artifacts:
      - src/ctx/cli.py
      - src/ctx/lifecycle.py
      - tests/test_retrofit_run.py
      - tests/test_retrofit_review_cli.py
    reason: >
      The command should make durable context easier to use than authoring or
      locating context files manually.

  - id: bundled-first-run-demo
    kind: decision
    title: Ship a complete model-free first-run project
    summary: >
      ctx demo creates working sample source and tests, two semantic scopes,
      canonical project hooks, and fresh lock evidence without invoking a model
      or writing registry state.
    artifacts:
      - README.md
      - src/ctx/demo.py
      - src/ctx/cli.py
      - tests/test_demo.py
    reason: >
      A pre-contextualized project lets a new user see progressive hydration and
      reconciliation immediately before trusting automation on their own code.

  - id: disposable-registry
    kind: invariant
    title: Registry state is disposable
    summary: >
      The CTX_HOME registry only discovers validated checkouts; project meaning
      remains reconstructable from version-controlled manifests, and registry
      deletion never changes a repository.

  - id: deterministic-freshness-evidence
    kind: pattern
    title: Deterministic freshness evidence
    summary: >
      Each semantic node hashes its nearest-owned eligible source records and
      canonical manifest data into the generated root lock. A fresh-graph
      retrofit review may replace only the exact lock it inspected and restores
      that prior lock if a later lifecycle step fails.
    artifacts:
      - src/ctx/freshness.py
      - src/ctx/reconciliation.py
    adoption:
      mode: adapt
      requires:
        - deterministic nearest-node ownership
        - exclusion of context internals, secrets, dependencies, and generated output
        - canonical serialization without timestamps or user identity
      adapt:
        - eligible source suffixes and generated-directory policy
        - Git acceleration where filesystem hashing remains authoritative
      verify:
        - identical source and context produce byte-identical locks
        - source changes report stale without rewriting durable manifests
        - failed reconciliation restores prior manifests and lock evidence

  - id: hook-driven-task-reconciliation
    kind: decision
    title: Lifecycle hooks preserve explicit reconciliation judgment
    summary: >
      Codex UserPromptSubmit captures an immutable baseline and hydrates; Stop
      continues that run at most once for review. Separately, an opt-in Git
      pre-commit hook checks deterministic freshness and directs developers to
      reconcile. It warns by default; blocking requires the working tree to
      match the index. Neither hook decides durable meaning or edits it.
    artifacts:
      - src/ctx/runs.py
      - src/ctx/codex_hooks.py
      - src/ctx/integration.py
      - src/ctx/git_integration.py
      - tests/test_hooks.py
      - tests/test_git_integration.py
    reason: >
      Task and commit boundaries prompt timely review without a watcher or
      per-save model call, while semantic judgment stays with an agent or human
      and the CLI remains agent-neutral.

  - id: run-completion-preserves-review-boundaries
    kind: invariant
    title: Run completion never blesses unreviewed state
    summary: >
      The baseline is immutable, raw task text and source contents are not
      persisted, acknowledgements apply only to the exact reviewed node
      fingerprints, completed markers cannot reopen old runs, pre-turn stale
      nodes require separate review, and completion refreshes only affected
      lock entries from one verified filesystem snapshot.
    artifacts:
      - src/ctx/runs.py
      - src/ctx/codex_hooks.py
      - src/ctx/freshness.py
      - tests/test_runs.py
      - tests/test_hooks.py
      - tests/test_freshness_subset.py

  - id: guarded-agent-proposals
    kind: invariant
    title: Agent automation returns constrained proposals
    summary: >
      Automation uses filtered read-only snapshots and a provider-compatible
      structural schema; local parsing enforces bounds, uniqueness, paths, and
      evidence. Reviews emit bounded stage and heartbeat progress. Every area
      disposition and material conflict blocks unresolved publication;
      evidence-bound plans create only missing manifests under one race-checked,
      rollback-safe lifecycle. AGENTS.md review separately saves an exact
      content-addressed proposal and requires explicit race-checked application.
    artifacts:
      - src/ctx/retrofit_agent.py
      - src/ctx/reconciliation.py
      - src/ctx/agent_instructions.py
      - src/ctx/lifecycle.py
      - tests/test_retrofit_inspection.py
      - tests/test_retrofit_run.py
      - tests/test_retrofit_review_cli.py
      - tests/test_reconcile.py
      - tests/test_agent_instructions.py
